        .tab-btn {

        .filter-btn.active {

            border-color: #dc3545;
        }
        .filter-btn-all.active {

            color: white;
            border-color: #007bff;
        }

<body>

<div class="container">
    <!-- Header with Institution Details -->
    <div class="institution-header">
        <h1>🕌 রশিকনগর মোহাম্মাদিয়া হাফিজিয়া নূরানী মাদ্রাসা ও এতিমখানা</h1>
        <p>📍 বটতলী বাজার সংলগ্ন, দীঘিনালা, খাগড়াছড়ি পার্বত্য জেলা</p>
    </div>

    <!-- Quick Stats Dashboard -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="num" id="stat-total-std">০</div>
            <div class="label">মোট শিক্ষার্থী</div>
        </div>
        <div class="stat-card">
            <div class="num" id="stat-total-tea">০</div>
            <div class="label">মোট শিক্ষক</div>
        </div>
        <div class="stat-card">
            <div class="num" id="stat-total-phone">০</div>
            <div class="label">সংযুক্ত ফোন</div>
        </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchClass('nursery')">নার্সারি</button>
        <button class="tab-btn" onclick="switchClass('class1')">১ম শ্রেণি</button>
        <button class="tab-btn" onclick="switchClass('class2')">২য় শ্রেণি</button>
        <button class="tab-btn" onclick="switchClass('class3')">৩য় শ্রেণি</button>
        <button class="tab-btn teacher-tab" onclick="switchClass('teachers')">👨‍🏫 শিক্ষকবৃন্দ</button>
    </div>

    <!-- Quick Filter Bar -->
    <div class="filter-bar">
        <button class="filter-btn filter-btn-all active" id="filter-all-btn" onclick="setPhoneFilter('all')">
            <i class="fa-solid fa-list"></i> সবাই
        </button>
        <button class="filter-btn" id="filter-nophone-btn" onclick="setPhoneFilter('no-phone')">
            <i class="fa-solid fa-phone-slash"></i> নম্বর ছাড়া (<span id="no-phone-count">০</span>)
        </button>
    </div>

    <!-- Search Input Bar -->
    <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" onkeyup="applyFilters()" placeholder="নাম, রোল বা ফোন নম্বর দিয়ে খুঁজুন...">
    </div>

    <!-- Group SMS Button -->
    <button class="group-sms-btn" onclick="sendGroupSMS()">
        <i class="fa-solid fa-comments"></i> বর্তমান তালিকার সবাইকে SMS পাঠান
    </button>

    <!-- Form Section -->
    <div class="form-group">
        <h4 id="form-title" style="font-size: 14px; color: #333;">নার্সারি শ্রেণিতে নতুন শিক্ষার্থী যুক্ত করুন</h4>
        <div class="form-row">
            <input type="number" id="stdRoll" placeholder="রোল / আইডি" min="1" style="max-width: 90px;">
            <input type="text" id="stdName" placeholder="নাম" required>
            <input type="tel" id="phoneNum" placeholder="মোবাইল নম্বর">
        </div>
        <button class="add-btn" id="submit-btn" onclick="addEntry()">যুক্ত করুন</button>
    </div>

    <!-- Title Bar -->
    <div class="list-title">
        <span><strong><span id="current-class-label">নার্সারি</span></strong> তালিকা</span>
        <span style="font-size: 13px; color: #666;" id="total-count">মোট: ০ জন</span>
    </div>

    <!-- Cards List Container -->
    <div class="contact-list" id="student-list-container">
        <!-- Cards will load dynamically here -->
    </div>
</div>

            });

    ];

    let schoolData = JSON.parse(localStorage.getItem('schoolDirectoryData_v14')) || {
        nursery: defaultNurseryData,
        class1: [],
        class2: [],
        class3: [],
        teachers: defaultTeacherData
    };

    // --- REALTIME FIREBASE SYNC ---
    db.collection('school').doc('madrasaData').onSnapshot((doc) => {
        if (doc.exists) {
            schoolData = doc.data();
            localStorage.setItem('schoolDirectoryData_v14', JSON.stringify(schoolData));
            applyFilters();
            updateStats();
        } else {
            saveData();
        }
    }, (error) => {
        console.log("Firebase sync fallback to local:", error);
    });

    // Save Data to both LocalStorage and Firebase Cloud
    function saveData() {
        localStorage.setItem('schoolDirectoryData_v14', JSON.stringify(schoolData));
        updateStats();
        db.collection('school').doc('madrasaData').set(schoolData)
            .catch(err => console.error("Firebase update failed:", err));
    }

    function switchClass(tabName) {
        currentClass = tabName;
        document.getElementById('searchInput').value = '';

        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        if (event && event.target) {
            event.target.classList.add('active');
        }

        const isTeacher = tabName === 'teachers';
        document.getElementById('current-class-label').innerText = classNameMap[tabName];
        
        if(isTeacher) {
            document.getElementById('form-title').innerText = `নতুন শিক্ষক যুক্ত করুন`;
            document.getElementById('stdName').placeholder = "শিক্ষকের নাম";
            document.getElementById('stdRoll').placeholder = "আইডি (ঐচ্ছিক)";
        } else {
            document.getElementById('form-title').innerText = `${classNameMap[tabName]} শ্রেণিতে নতুন শিক্ষার্থী যুক্ত করুন`;
            document.getElementById('stdName').placeholder = "শিক্ষার্থীর নাম";
            document.getElementById('stdRoll').placeholder = "রোল";
        }

        applyFilters();
    }

    // Toggle Phone Filter
    function setPhoneFilter(filterType) {
        currentPhoneFilter = filterType;
        
        const allBtn = document.getElementById('filter-all-btn');
        const noPhoneBtn = document.getElementById('filter-nophone-btn');

        if (filterType === 'no-phone') {
            allBtn.classList.remove('active');
            noPhoneBtn.classList.add('active');
        } else {
            noPhoneBtn.classList.remove('active');
            allBtn.classList.add('active');
        }

        applyFilters();
    }

    // Master Filter Function
    function applyFilters() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        let list = schoolData[currentClass] || [];

        const noPhoneCount = list.filter(item => !item.phone || item.phone.trim() === '').length;
        document.getElementById('no-phone-count').innerText = noPhoneCount;

        if (currentPhoneFilter === 'no-phone') {
            list = list.filter(item => !item.phone || item.phone.trim() === '');
        }

        if (query) {
            list = list.filter(item => {
                const nameMatch = item.name.toLowerCase().includes(query);
                const phoneMatch = item.phone ? item.phone.includes(query) : false;
                const rollMatch = item.roll ? item.roll.toString().includes(query) : false;
                return nameMatch || phoneMatch || rollMatch;
            });
        }

        renderList(list);
    }

    // Add Entry
    function addEntry() {
        const roll = document.getElementById('stdRoll').value.trim();
        const name = document.getElementById('stdName').value.trim();
        const phone = document.getElementById('phoneNum').value.trim();

        if (!name) {
            alert('দয়া করে নাম লিখুন!');
            return;
        }

        if(!schoolData[currentClass]) {
            schoolData[currentClass] = [];
        }

        const newEntry = {
            id: Date.now(),
            roll: roll ? parseInt(roll) : (schoolData[currentClass].length + 1),
            name: name,
            phone: phone
        };

        schoolData[currentClass].push(newEntry);
        saveData();

        document.getElementById('stdRoll').value = '';
        document.getElementById('stdName').value = '';
        document.getElementById('phoneNum').value = '';
    }

    // Rename Entry
    function renameEntry(id) {
        const item = schoolData[currentClass].find(entry => entry.id === id);
        if (item) {
            const newName = prompt("সঠিক বা নতুন নাম লিখুন:", item.name);
            if (newName !== null && newName.trim() !== "") {
                item.name = newName.trim();
                saveData();
            }
        }
    }

    // Update Phone
    function updatePhone(id) {
        const phoneInput = document.getElementById(`phone-${id}`).value.trim();

        const item = schoolData[currentClass].find(entry => entry.id === id);
        if (item) {
            item.phone = phoneInput;
            saveData();
            alert('ফোন নম্বর সেভ করা হয়েছে!');
        }
    }

    // Delete Entry
    function deleteEntry(id) {
        const label = currentClass === 'teachers' ? 'শিক্ষককে' : 'শিক্ষার্থীকে';
        if (confirm(`আপনি কি এই ${label} মুছে ফেলতে চান?`)) {
            schoolData[currentClass] = schoolData[currentClass].filter(entry => entry.id !== id);
            saveData();
        }
    }

    // Send Group SMS
    function sendGroupSMS() {
        const list = schoolData[currentClass] || [];
        const phoneNumbers = list
            .map(item => item.phone ? item.phone.trim() : '')
            .filter(phone => phone !== '')
            .join(',');

        if (!phoneNumbers) {
            alert('বর্তমান তালিকায় কোনো ফোন নম্বর পাওয়া যায়নি!');
            return;
        }

        const defaultMsg = `রসিকনগর মোহাম্মাদিয়া হাফিজিয়া নূরানী মাদ্রাসা ও এতিমখানা (${classNameMap[currentClass]}) এর জরুরি বিজ্ঞপ্তি: `;
        const message = encodeURIComponent(defaultMsg);
        
        window.location.href = `sms:${phoneNumbers}?body=${message}`;
    }

    // Update Quick Stats
    function updateStats() {
        let totalStd = 0;
        let totalTea = schoolData.teachers ? schoolData.teachers.length : 0;
        let totalPhone = 0;

        ['nursery', 'class1', 'class2', 'class3'].forEach(cls => {
            if (schoolData[cls]) totalStd += schoolData[cls].length;
        });

        Object.keys(schoolData).forEach(key => {
            if (Array.isArray(schoolData[key])) {
                schoolData[key].forEach(item => {
                    if(item.phone && item.phone.trim() !== '') totalPhone++;
                });
            }
        });

        document.getElementById('stat-total-std').innerText = totalStd;
        document.getElementById('stat-total-tea').innerText = totalTea;
        document.getElementById('stat-total-phone').innerText = totalPhone;
    }

    // Render List View
    function renderList(list) {
        const container = document.getElementById('student-list-container');
        container.innerHTML = '';

        document.getElementById('total-count').innerText = `মোট: ${list.length} জন`;

        if (list.length === 0) {
            container.innerHTML = `<div class="empty-msg">কোনো তথ্য পাওয়া যায়নি।</div>`;
            return;
        }

        list.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'contact-card';

            const rollDisplay = item.roll || (index + 1);
            const rollLabel = currentClass === 'teachers' ? 'আইডি' : 'রোল';

            const callBtnHtml = item.phone 
                ? `<a href="tel:${item.phone}" class="call-btn"><i class="fa-solid fa-phone"></i> কল</a>`
                : `<a class="call-btn disabled"><i class="fa-solid fa-phone"></i> নেই</a>`;

            card.innerHTML = `
                <div class="card-info">
                    <div class="card-header-line">
                        <span class="roll-badge">${rollLabel} ${rollDisplay}</span>
                        <span class="person-name">${item.name}</span>
                        <i class="fa-solid fa-pencil rename-btn" onclick="renameEntry(${item.id})" title="নাম সংশোধন করুন"></i>
                    </div>
                    <div class="phone-action-box">
                        <input type="tel" id="phone-${item.id}" class="phone-input" value="${item.phone || ''}" placeholder="নম্বর লিখুন">
                        <button class="save-mini-btn" onclick="updatePhone(${item.id})">সেভ</button>
                    </div>
                </div>
                <div class="card-actions">
                    ${callBtnHtml}
                    <i class="fa-solid fa-trash delete-btn" onclick="deleteEntry(${item.id})" title="মুছে ফেলুন"></i>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // Initial Load
    applyFilters();
    updateStats();
</script>

</body>
</html>
