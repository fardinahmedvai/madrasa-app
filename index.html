<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>রসিকনগর মোহাম্মাদিয়া হাফিজিয়া নূরানী মাদ্রাসা ও এতিমখানা</title>
    
    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d5c3a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3602/3602145.png">

    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase Core & Firestore SDK (CDN) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            padding: 10px;
            color: #333;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        
        /* Top Admin & Login Bar */
        .top-access-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2c3e50;
            color: white;
            padding: 8px 12px;
            border-radius: 8px 8px 0 0;
            font-size: 13px;
        }
        .role-badge-status {
            font-weight: bold;
            background: #27ae60;
            padding: 2px 8px;
            border-radius: 4px;
        }
        .login-btn-top {
            background: #3498db;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .logout-btn-top {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            display: none;
        }

        /* Institution Header */
        .institution-header {
            text-align: center;
            background: linear-gradient(135deg, #0d5c3a, #1b8a5a);
            color: white;
            padding: 16px 12px;
        }
        .institution-header h1 {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
            line-height: 1.3;
        }
        .institution-header p {
            font-size: 13px;
            opacity: 0.95;
        }

        /* Notice Board Styling */
        .notice-banner {
            background: #fff3cd;
            border: 1px solid #ffeeba;
            color: #856404;
            padding: 10px 12px;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .notice-text {
            flex: 1;
            font-weight: 600;
        }
        .notice-edit-btn {
            background: #856404;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            display: none;
            align-items: center;
            gap: 4px;
        }

        /* Live Clock Banner */
        .live-clock-card {
            background: #e8f5e9;
            border: 1px solid #c8e6c9;
            border-top: none;
            padding: 8px 12px;
            border-radius: 0 0 10px 10px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #0d5c3a;
            font-size: 13px;
            font-weight: 600;
        }
        .live-clock-card .time-box {
            font-size: 15px;
            font-weight: bold;
            background: #0d5c3a;
            color: #fff;
            padding: 3px 10px;
            border-radius: 15px;
        }

        /* Tab Buttons */
        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 15px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px 6px;
            background: #e4e6eb;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
            font-size: 13px;
            color: #444;
        }
        .tab-btn.active {
            background: #007bff;
            color: #fff;
        }
        .tab-btn.result-tab {
            background: #ff9800;
            color: #fff;
        }
        .tab-btn.result-tab.active {
            background: #e65100;
        }

        /* Common Box Styles */
        .section-box {
            background: #f8f9fa;
            border: 1px solid #e0e0e0;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        /* Search & Result System Styles */
        .result-search-card {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .result-search-card select, .result-search-card input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        .search-res-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Marksheet Design */
        .marksheet-box {
            background: #fff;
            border: 2px solid #0d5c3a;
            padding: 20px;
            border-radius: 8px;
            margin-top: 15px;
            position: relative;
        }
        .marksheet-header {
            text-align: center;
            border-bottom: 2px solid #0d5c3a;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .marksheet-title {
            font-size: 16px;
            font-weight: bold;
            color: #0d5c3a;
        }
        .marksheet-info {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .marks-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }
        .marks-table th, .marks-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
            font-size: 14px;
        }
        .marks-table th {
            background-color: #0d5c3a;
            color: white;
        }
        .rank-badge {
            background: #ffc107;
            color: #000;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
        }
        .print-mark-btn {
            background: #17a2b8;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
        }

        /* Admin Result Entry Form */
        .subject-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
        .subject-row input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        /* Card List Styles */
        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .contact-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            padding: 12px;
        }
        .roll-badge {
            background: #e7f1ff;
            color: #007bff;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
        }

        @media print {
            body * {
                visibility: hidden;
            }
            #printable-marksheet, #printable-marksheet * {
                visibility: visible;
            }
            #printable-marksheet {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }
            .print-mark-btn {
                display: none !important;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Top Role & Login Control Bar -->
    <div class="top-access-bar">
        <span>মোড: <span class="role-badge-status" id="user-role-label">অভিভাবক মোড</span></span>
        <button class="login-btn-top" id="login-btn" onclick="openLoginPrompt()"><i class="fa-solid fa-key"></i> লগইন</button>
        <button class="logout-btn-top" id="logout-btn" onclick="logoutRole()"><i class="fa-solid fa-right-from-bracket"></i> লগআউট</button>
    </div>

    <!-- Header with Institution Details -->
    <div class="institution-header">
        <h1>🕌 রসিকনগর মোহাম্মাদিয়া হাফিজিয়া নূরানী মাদ্রাসা ও এতিমখানা</h1>
        <p>📍 বটতলী বাজার সংলগ্ন, দীঘিনালা, খাগড়াছড়ি পার্বত্য জেলা</p>
    </div>

    <!-- Live Notice Banner -->
    <div class="notice-banner">
        <i class="fa-solid fa-bullhorn"></i>
        <div class="notice-text" id="live-notice-text">জরুরি নোটিশ: লোড হচ্ছে...</div>
        <button class="notice-edit-btn" id="notice-edit-btn" onclick="updateNotice()"><i class="fa-solid fa-pen-to-square"></i> এডিট</button>
    </div>

    <!-- Live Date and Clock Banner -->
    <div class="live-clock-card">
        <span><i class="fa-regular fa-calendar-days"></i> <span id="current-date-text">লোড হচ্ছে...</span></span>
        <span class="time-box" id="current-time-text">00:00:00 AM</span>
    </div>

    <!-- Navigation Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('directory')">📁 ডিরেক্টরি</button>
        <button class="tab-btn result-tab" onclick="switchTab('result')">📊 পরীক্ষার ফলাফল</button>
    </div>

    <!-- SECTION 1: DIRECTORY SECTION -->
    <div id="directory-section">
        <!-- Class Sub Tabs -->
        <div class="tabs">
            <button class="tab-btn active class-sub-btn" onclick="switchClass('nursery')">নার্সারি</button>
            <button class="tab-btn class-sub-btn" onclick="switchClass('class1')">১ম শ্রেণি</button>
            <button class="tab-btn class-sub-btn" onclick="switchClass('class2')">২য় শ্রেণি</button>
            <button class="tab-btn class-sub-btn" onclick="switchClass('class3')">৩য় শ্রেণি</button>
        </div>

        <!-- Search Input Bar -->
        <div style="margin-bottom: 12px;">
            <input type="text" id="searchInput" onkeyup="applyFilters()" placeholder="নাম বা রোল দিয়ে খুঁজুন..." style="width:100%; padding:10px; border-radius:6px; border:1px solid #ccc;">
        </div>

        <!-- Directory Entry Form (Teacher/Admin) -->
        <div class="section-box" id="dir-form-sec" style="display:none;">
            <h4 id="form-title" style="margin-bottom:8px; font-size: 14px;">নতুন শিক্ষার্থী যুক্ত করুন</h4>
            <div style="display:flex; gap:8px; margin-bottom:8px;">
                <input type="number" id="stdRoll" placeholder="রোল" style="width:70px; padding:8px;">
                <input type="text" id="stdName" placeholder="নাম" style="flex:1; padding:8px;">
                <input type="tel" id="phoneNum" placeholder="মোবাইল নম্বর" style="flex:1; padding:8px;">
            </div>
            <button onclick="addEntry()" style="width:100%; padding:9px; background:#28a745; color:#fff; border:none; border-radius:5px; font-weight:bold;">যুক্ত করুন</button>
        </div>

        <!-- Cards List Container -->
        <div class="contact-list" id="student-list-container"></div>
    </div>

    <!-- SECTION 2: RESULT SECTION -->
    <div id="result-section" style="display:none;">
        <!-- Search Result Box for Parents -->
        <div class="section-box">
            <h3 style="font-size: 15px; margin-bottom: 10px; color:#0d5c3a;"><i class="fa-solid fa-graduation-cap"></i> ফলাফল খুঁজুন</h3>
            <div class="result-search-card">
                <select id="resSearchClass">
                    <option value="nursery">নার্সারি</option>
                    <option value="class1">১ম শ্রেণি</option>
                    <option value="class2">২য় শ্রেণি</option>
                    <option value="class3">৩য় শ্রেণি</option>
                </select>
                <input type="text" id="resSearchQuery" placeholder="রোল নম্বর অথবা শিক্ষার্থীর নাম লিখুন...">
                <button class="search-res-btn" onclick="searchResult()"><i class="fa-solid fa-search"></i> ফলাফল দেখুন</button>
            </div>
        </div>

        <!-- Result View Sheet Area -->
        <div id="result-display-area"></div>

        <!-- Admin Result Entry Panel -->
        <div class="section-box" id="admin-result-entry" style="display:none; margin-top:20px;">
            <h3 style="font-size: 15px; margin-bottom: 10px; color:#e65100;"><i class="fa-solid fa-pen-to-square"></i> ফলাফল আপডেট ও এনট্রি (অ্যাডমিন)</h3>
            <div style="display:flex; flex-direction:column; gap:10px;">
                <select id="resInputClass" onchange="loadStudentsForResult()">
                    <option value="nursery">নার্সারি শ্রেণি</option>
                    <option value="class1">১ম শ্রেণি</option>
                    <option value="class2">২য় শ্রেণি</option>
                    <option value="class3">৩য় শ্রেণি</option>
                </select>
                <select id="resInputStudent">
                    <option value="">শিক্ষার্থী নির্বাচন করুন...</option>
                </select>
                
                <p style="font-size:12px; font-weight:bold; margin-top:5px;">বিষয় ও নম্বর যুক্ত করুন:</p>
                <div id="subjects-container">
                    <div class="subject-row">
                        <input type="text" placeholder="বিষয়ের নাম (যেমন: বাংলা)" class="sub-name">
                        <input type="number" placeholder="প্রাপ্ত নম্বর" class="sub-marks">
                    </div>
                </div>
                <button onclick="addSubjectRow()" style="background:#6c757d; color:#fff; border:none; padding:5px 10px; border-radius:4px; font-size:12px; align-self:flex-start;">+ বিষয় যোগ করুন</button>
                
                <button onclick="saveStudentResult()" style="background:#e65100; color:#fff; border:none; padding:10px; border-radius:5px; font-weight:bold; cursor:pointer; margin-top:10px;">রেজাল্ট সেভ করুন</button>
            </div>
        </div>
    </div>
</div>

<script>
    const TEACHER_PIN = "987321";
    const ADMIN_PIN   = "577147";
    let currentRole = sessionStorage.getItem('user_role_state') || 'guest';

    // Live Clock System
    function updateLiveClock() {
        const now = new Date();
        const toBengali = (str) => str.replace(/[0-9]/g, d => ['০','১','২','৩','৪','৫','৬','৭','৮','৯'][d]);
        const formattedDate = now.toLocaleDateString('bn-BD', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        let hours = now.getHours();
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12;
        
        document.getElementById('current-date-text').innerText = formattedDate;
        document.getElementById('current-time-text').innerText = `${toBengali(String(hours).padStart(2, '0'))}:${toBengali(minutes)}:${toBengali(seconds)} ${ampm}`;
    }
    setInterval(updateLiveClock, 1000);
    updateLiveClock();

    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyDin6g4B_Pb4A80ckKgH79VxdzAr6K2dDQ",
      authDomain: "rashiknagar-madrasa.firebaseapp.com",
      projectId: "rashiknagar-madrasa",
      storageBucket: "rashiknagar-madrasa.firebasestorage.app",
      messagingSenderId: "146452632375",
      appId: "1:146452632375:web:44635b304aa60bec2180b2"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentClass = 'nursery';
    let schoolData = JSON.parse(localStorage.getItem('schoolDirectoryData_v19')) || {
        notice: "আগামীকাল মাদরাসা খোলা থাকবে।",
        nursery: [], class1: [], class2: [], class3: [],
        results: {} 
    };

    // Firebase Sync
    db.collection('school').doc('madrasaData').onSnapshot((doc) => {
        if (doc.exists) {
            schoolData = doc.data();
            if(!schoolData.results) schoolData.results = {};
            localStorage.setItem('schoolDirectoryData_v19', JSON.stringify(schoolData));
            document.getElementById('live-notice-text').innerText = schoolData.notice || "নোটিশ নেই।";
            applyFilters();
            loadStudentsForResult();
        } else {
            saveData();
        }
    });

    function saveData() {
        localStorage.setItem('schoolDirectoryData_v19', JSON.stringify(schoolData));
        db.collection('school').doc('madrasaData').set(schoolData);
    }

    // Role Management
    function openLoginPrompt() {
        const pin = prompt("শিক্ষক বা অ্যাডমিন পিন দিন:");
        if (pin === ADMIN_PIN) {
            currentRole = 'admin';
            sessionStorage.setItem('user_role_state', 'admin');
            alert("অ্যাডমিন হিসেবে লগইন হয়েছে!");
        } else if (pin === TEACHER_PIN) {
            currentRole = 'teacher';
            sessionStorage.setItem('user_role_state', 'teacher');
            alert("শিক্ষক হিসেবে লগইন হয়েছে!");
        } else if(pin !== null) {
            alert("ভুল পিন!");
        }
        updateRoleUI();
        applyFilters();
    }

    function logoutRole() {
        currentRole = 'guest';
        sessionStorage.removeItem('user_role_state');
        updateRoleUI();
        applyFilters();
    }

    function updateRoleUI() {
        const roleLabel = document.getElementById('user-role-label');
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const dirForm = document.getElementById('dir-form-sec');
        const adminRes = document.getElementById('admin-result-entry');

        if (currentRole === 'admin' || currentRole === 'teacher') {
            roleLabel.innerText = currentRole === 'admin' ? "অ্যাডমিন মোড" : "শিক্ষক মোড";
            loginBtn.style.display = "none";
            logoutBtn.style.display = "inline-block";
            dirForm.style.display = "block";
            adminRes.style.display = (currentRole === 'admin') ? "block" : "none";
        } else {
            roleLabel.innerText = "অভিভাবক মোড";
            loginBtn.style.display = "inline-block";
            logoutBtn.style.display = "none";
            dirForm.style.display = "none";
            adminRes.style.display = "none";
        }
    }

    // Switch Main Tabs
    function switchTab(tab) {
        document.getElementById('directory-section').style.display = (tab === 'directory') ? 'block' : 'none';
        document.getElementById('result-section').style.display = (tab === 'result') ? 'block' : 'none';
        document.querySelectorAll('.tabs .tab-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        if(tab === 'result') loadStudentsForResult();
    }

    function switchClass(cls) {
        currentClass = cls;
        applyFilters();
    }

    function applyFilters() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        let list = schoolData[currentClass] || [];

        if (query) {
            list = list.filter(item => item.name.toLowerCase().includes(query) || (item.roll && item.roll.toString().includes(query)));
        }
        renderList(list);
    }

    function renderList(list) {
        const container = document.getElementById('student-list-container');
        container.innerHTML = '';
        if(list.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:15px; color:#888;">কোনো ডাটা পাওয়া যায়নি</div>';
            return;
        }
        list.forEach((item) => {
            const card = document.createElement('div');
            card.className = 'contact-card';
            card.innerHTML = `
                <div>
                    <span class="roll-badge">রোল ${item.roll || '-'}</span>
                    <strong style="margin-left:5px;">${item.name}</strong>
                </div>
                <div style="font-size:13px; color:#666;">
                    ${currentRole !== 'guest' ? (item.phone || 'নম্বর নেই') : '🔒 সুরক্ষিত'}
                </div>
            `;
            container.appendChild(card);
        });
    }

    function addEntry() {
        if (currentRole === 'guest') return;
        const roll = document.getElementById('stdRoll').value.trim();
        const name = document.getElementById('stdName').value.trim();
        const phone = document.getElementById('phoneNum').value.trim();

        if (!name) return alert('নাম লিখুন');
        if(!schoolData[currentClass]) schoolData[currentClass] = [];

        schoolData[currentClass].push({ id: Date.now(), roll: roll ? parseInt(roll) : (schoolData[currentClass].length + 1), name, phone });
        saveData();
        document.getElementById('stdRoll').value = '';
        document.getElementById('stdName').value = '';
        document.getElementById('phoneNum').value = '';
    }

    // --- RESULT MANAGEMENT FUNCTIONS ---

    function loadStudentsForResult() {
        const cls = document.getElementById('resInputClass').value;
        const stdSelect = document.getElementById('resInputStudent');
        stdSelect.innerHTML = '<option value="">শিক্ষার্থী নির্বাচন করুন...</option>';
        
        const students = schoolData[cls] || [];
        students.forEach(std => {
            stdSelect.innerHTML += `<option value="${std.id}">রোল: ${std.roll} - ${std.name}</option>`;
        });
    }

    function addSubjectRow() {
        const container = document.getElementById('subjects-container');
        const div = document.createElement('div');
        div.className = 'subject-row';
        div.innerHTML = `
            <input type="text" placeholder="বিষয়ের নাম" class="sub-name">
            <input type="number" placeholder="প্রাপ্ত নম্বর" class="sub-marks">
        `;
        container.appendChild(div);
    }

    function saveStudentResult() {
        const cls = document.getElementById('resInputClass').value;
        const stdId = document.getElementById('resInputStudent').value;
        
        if(!stdId) return alert("শিক্ষার্থী নির্বাচন করুন!");

        const names = document.querySelectorAll('.sub-name');
        const marks = document.querySelectorAll('.sub-marks');
        
        let subjects = [];
        let total = 0;

        for(let i=0; i<names.length; i++) {
            let sName = names[i].value.trim();
            let sMark = parseInt(marks[i].value) || 0;
            if(sName) {
                subjects.push({ subject: sName, mark: sMark });
                total += sMark;
            }
        }

        if(subjects.length === 0) return alert("কমপক্ষে ১ টি বিষয় যুক্ত করুন!");

        if(!schoolData.results) schoolData.results = {};
        schoolData.results[stdId] = { subjects, total, class: cls };

        saveData();
        alert("ফলাফল সফলভাবে সংরক্ষণ করা হয়েছে!");
    }

    function searchResult() {
        const cls = document.getElementById('resSearchClass').value;
        const query = document.getElementById('resSearchQuery').value.toLowerCase().trim();
        const display = document.getElementById('result-display-area');

        if(!query) return alert("রোল বা নাম লিখুন!");

        const students = schoolData[cls] || [];
        const foundStudent = students.find(s => s.roll.toString() === query || s.name.toLowerCase().includes(query));

        if(!foundStudent) {
            display.innerHTML = `<div style="text-align:center; padding:20px; color:red;">কোনো ফলাফল পাওয়া যায়নি! সঠিক রোল বা নাম লিখুন।</div>`;
            return;
        }

        const resData = schoolData.results ? schoolData.results[foundStudent.id] : null;

        if(!resData) {
            display.innerHTML = `<div style="text-align:center; padding:20px; color:#666;">'${foundStudent.name}' এর ফলাফল এখনও আপলোড করা হয়নি।</div>`;
            return;
        }

        // Calculate Rank
        let allResInClass = students.map(s => {
            return { id: s.id, total: (schoolData.results && schoolData.results[s.id]) ? schoolData.results[s.id].total : 0 };
        }).sort((a,b) => b.total - a.total);

        let rank = allResInClass.findIndex(r => r.id === foundStudent.id) + 1;

        // Render Marksheet
        let rowsHtml = '';
        resData.subjects.forEach(sub => {
            rowsHtml += `<tr><td>${sub.subject}</td><td>${sub.mark}</td></tr>`;
        });

        const classNameMap = {'nursery':'নার্সারি', 'class1':'১ম শ্রেণি', 'class2':'২য় শ্রেণি', 'class3':'৩য় শ্রেণি'};

        display.innerHTML = `
            <div class="marksheet-box" id="printable-marksheet">
                <div class="marksheet-header">
                    <h2>রসিকনগর মোহাম্মাদিয়া হাফিজিয়া নূরানী মাদ্রাসা</h2>
                    <div class="marksheet-title">পরীক্ষার ফলাফল ও নম্বরপত্র</div>
                </div>
                <div class="marksheet-info">
                    <div>
                        <p>শিক্ষার্থীর নাম: <strong>${foundStudent.name}</strong></p>
                        <p>শ্রেণি: <strong>${classNameMap[cls]}</strong></p>
                    </div>
                    <div style="text-align:right;">
                        <p>রোল নম্বর: <strong>${foundStudent.roll}</strong></p>
                        <p>মেধাক্রম (Rank): <span class="rank-badge">${rank} তম</span></p>
                    </div>
                </div>
                <table class="marks-table">
                    <thead>
                        <tr><th>বিষয়</th><th>প্রাপ্ত নম্বর</th></tr>
                    </thead>
                    <tbody>
                        ${rowsHtml}
                        <tr style="font-weight:bold; background:#f8f9fa;">
                            <td>সর্বমোট নম্বর (Total)</td>
                            <td>${resData.total}</td>
                        </tr>
                    </tbody>
                </table>
                <button class="print-mark-btn" onclick="window.print()"><i class="fa-solid fa-download"></i> রেজাল্ট ডাউনলোড / প্রিন্ট করুন</button>
            </div>
        `;
    }

    updateRoleUI();
    applyFilters();
</script>

</body>
</html>
